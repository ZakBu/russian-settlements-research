name: SGRT RFSD recovery missing years
on:
  push:
    branches: [research/sgrt-final-protocol-20261018]
    paths: [.github/workflows/sgrt-rfsd-recovery-20261019.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/sgrt_recovered_20261019/rfsd
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy pyarrow
      - run: python -u research/sgrt_recovered_20261019/rfsd/cloud_reference_missing.py --out recovered_rfsd_missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sgrt-rfsd-recovered-missing-20261019
          path: recovered_rfsd_missing/
          retention-days: 30
