name: Check Saratov service evidence
on:
  push:
    branches: [research/saratov-service-evidence-20261103]
    paths: [.github/workflows/publish-saratov-service-evidence.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 pyarrow==26.0.0 shapely==2.1.2 pyproj==3.7.2
      - name: Test foreign curves, parallel minimum costs and external membership
        run: python -m unittest tests.test_sgrt_saratov_domestic_native_edges tests.test_sgrt_saratov_centre_evidence_audit tests.test_sgrt_saratov_country_scope -v
      - name: Validate the existing atlas and repository policy
        run: |
          python scripts/site_content.py validate --json
          python scripts/check_repository_policy.py
