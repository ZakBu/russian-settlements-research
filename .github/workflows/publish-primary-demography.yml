name: Rebuild primary-centre demography and prepare a draft
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: primary-demography-20261027-v1
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-common-systems.txt
      - name: Scientific and immutable-draft counterexamples
        run: |
          python -m unittest discover -s tests -p 'test_sgrt_zero_primary_centre_demography.py'
          python -m unittest discover -s tests -p 'test_sgrt_zero_cloud_primary_demography.py'
      - name: Rebuild four pinned inputs and compare every output column
        run: python scripts/sgrt_zero/cloud_primary_demography.py --source-commit "$GITHUB_SHA" --workdir "$RUNNER_TEMP/primary-demography"
      - name: Create draft only; root independently verifies before publication
        run: python scripts/sgrt_zero/cloud_primary_demography.py --source-commit "$GITHUB_SHA" --draft-built "$RUNNER_TEMP/primary-demography/built"
      - name: Preserve controls and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: primary-demography-controls
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/primary-demography/source_facts.json
            ${{ runner.temp }}/primary-demography/actual_control.json
            ${{ runner.temp }}/primary-demography/results/summary.json
            ${{ runner.temp }}/primary-demography/built/manifest.json
