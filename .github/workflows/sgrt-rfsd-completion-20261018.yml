name: SGRT RFSD verified missing-year aggregates
on:
  push:
    branches: [research/sgrt-final-protocol-20261018]
    paths: [.github/workflows/sgrt-rfsd-completion-20261018.yml]
permissions:
  contents: read
jobs:
  aggregate-verified-public-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/sgrt_results_20261018/rfsd
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy pyarrow
      - name: Inspect pinned schema, verify source SHA, aggregate selected columns
        run: python -u research/sgrt_results_20261018/rfsd/cloud_missing_years.py --out cloud_rfsd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sgrt-rfsd-completion-20261018
          path: cloud_rfsd/
          retention-days: 30
