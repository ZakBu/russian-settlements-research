name: Saratov regional population structure and external checks
on:
  workflow_dispatch:
    inputs:
      include_stress:
        description: Preserve 72 earlier k-neighbour sensitivity scenarios
        type: boolean
        default: true
  push:
    branches: [research/saratov-regional-structure-20261106]
    paths: [.github/workflows/saratov-regional-structure.yml]
permissions:
  contents: write
concurrency:
  group: saratov-regional-structure-20261106-v1
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      INCLUDE_STRESS: ${{ github.event_name != 'workflow_dispatch' || inputs.include_stress }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 pyarrow==26.0.0 shapely==2.1.2 pyproj==3.7.2 scipy==1.17.0
      - name: Check ascent, ambiguity, external validation and map logic
        run: python -m unittest tests.test_sgrt_saratov_regional_structure tests.test_sgrt_saratov_regional_validation tests.test_sgrt_saratov_regional_controls tests.test_sgrt_saratov_regional_explanation tests.test_sgrt_saratov_regional_structure_maps -v
      - name: Reproduce pinned inputs and publish immutable focused outputs
        shell: bash
        run: |
          stress_flag=--include-stress
          if [ "$INCLUDE_STRESS" != true ]; then stress_flag=--no-include-stress; fi
          python -m scripts.sgrt_saratov.cloud_regional_structure --work "$RUNNER_TEMP/saratov-regional-structure" "$stress_flag"
      - name: Save published scientific summary and manifest to the producing branch
        env:
          PRODUCER_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_context/analysis_snapshots/saratov_regional_structure_20261106.json research_context/analysis_snapshots/saratov_regional_structure_manifest_20261106.json
          git commit -m 'Save published Saratov regional structure calculation and immutable manifest'
          git push origin "HEAD:$PRODUCER_BRANCH"
