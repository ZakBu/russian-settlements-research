name: Rebuild the comparative settlement-field pilot
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: field-pilot-20261028-v1
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-field-pilot.txt
      - name: Numerical counterexamples and source semantics
        run: python -m unittest discover -s tests -p 'test_sgrt_field*.py'
      - name: Rebuild from immutable public inputs
        run: python scripts/sgrt_field_pilot/cloud_pilot.py --source-commit "$GITHUB_SHA" --workdir "$RUNNER_TEMP/field-pilot"
      - name: Preserve all-row comparison and independent calculations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: settlement-field-pilot-checks
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/field-pilot/actual_control.json
            ${{ runner.temp }}/field-pilot/checks/*.json
            ${{ runner.temp }}/field-pilot/built/manifest.json
