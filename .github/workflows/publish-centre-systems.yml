name: Rebuild and publish direct centre systems
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: centre-systems-20261025-v1
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require existing empty immutable draft
        run: python scripts/sgrt_zero/cloud_centre_rebuild.py --check-empty-draft --source-commit "$GITHUB_SHA"
      - name: Install pinned scientific dependencies
        run: python -m pip install -r requirements-sgrt-zero.txt
      - name: Run zero-level regression checks
        run: |
          mkdir -p "$RUNNER_TEMP/centre-tests"
          set -o pipefail
          python -m unittest discover -s tests -p 'test_sgrt_zero_*.py' 2>&1 | tee "$RUNNER_TEMP/centre-tests/unittest.log"
      - name: Restore, rebuild, independently compare and package
        run: python scripts/sgrt_zero/cloud_centre_rebuild.py --workdir "$RUNNER_TEMP/centre-cloud" --source-commit "$GITHUB_SHA"
      - name: Upload four checked assets and publish the existing draft
        run: python scripts/sgrt_zero/cloud_centre_rebuild.py --publish-built "$RUNNER_TEMP/centre-cloud/built" --source-commit "$GITHUB_SHA"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: centre-rebuild-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/centre-tests/unittest.log
            ${{ runner.temp }}/centre-cloud/logs/*.log
            ${{ runner.temp }}/centre-cloud/analysis/*check*.json
            ${{ runner.temp }}/centre-cloud/analysis/independent_tail_audit.json
            ${{ runner.temp }}/centre-cloud/analysis/independent_tail_audit_cases.parquet
            ${{ runner.temp }}/centre-cloud/analysis/scenarios/daily_20_school30_wb/centre_stars.parquet
            ${{ runner.temp }}/centre-cloud/analysis/readout.json
            ${{ runner.temp }}/centre-cloud/analysis/checked_model_centres.csv
            ${{ runner.temp }}/centre-cloud/analysis/scenarios/*/summary.json
            ${{ runner.temp }}/centre-cloud/analysis/scenarios/*/strict_three_core_memberships.parquet
            ${{ runner.temp }}/centre-cloud/analysis/scenarios/*/strict_three_core_stars.parquet
            ${{ runner.temp }}/centre-cloud/routes/independent_forward_checks.json
            ${{ runner.temp }}/centre-cloud/built/manifest.json
