name: Rebuild and publish repaired level-zero centres
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: identity-centres-20261026-v2
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require the retained unpublished source assets
        run: python scripts/sgrt_zero/cloud_identity_rebuild.py --source-commit "$GITHUB_SHA" --check-source-draft
      - name: Install pinned scientific dependencies
        run: python -m pip install -r requirements-sgrt-zero.txt
      - name: Scientific regression tests
        run: |
          mkdir -p "$RUNNER_TEMP/identity-tests"
          set -o pipefail
          python -m unittest discover -s tests -p 'test_sgrt_zero_*.py' 2>&1 | tee "$RUNNER_TEMP/identity-tests/unittest.log"
      - name: Rebuild from immutable sources and compare every scientific identity
        run: |
          python scripts/sgrt_zero/cloud_identity_rebuild.py \
            --workdir "$RUNNER_TEMP/identity-cloud" --source-commit "$GITHUB_SHA" \
            --control research_context/analysis_snapshots/identity_model_control_20261026.json
      - name: Publish all checked outputs without replacing source assets
        run: |
          python scripts/sgrt_zero/cloud_identity_rebuild.py \
            --source-commit "$GITHUB_SHA" --publish-built "$RUNNER_TEMP/identity-cloud/built"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: identity-rebuild-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/identity-tests/unittest.log
            ${{ runner.temp }}/identity-cloud/logs/*.log
            ${{ runner.temp }}/identity-cloud/analysis/*control*.json
            ${{ runner.temp }}/identity-cloud/analysis/*verification*.json
            ${{ runner.temp }}/identity-cloud/analysis/*check*.json
            ${{ runner.temp }}/identity-cloud/analysis/figures/figure_values.json
            ${{ runner.temp }}/identity-cloud/analysis/source_readout/**/*.json
            ${{ runner.temp }}/identity-cloud/registry/summary.json
            ${{ runner.temp }}/identity-cloud/registry/level0_centres.parquet
            ${{ runner.temp }}/identity-cloud/routes/summary.json
            ${{ runner.temp }}/identity-cloud/routes/independent_forward_checks.json
            ${{ runner.temp }}/identity-cloud/boundaries/manifest.json
            ${{ runner.temp }}/identity-cloud/built/manifest.json
