name: Freeze federal medical NSI inputs
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-zero-federal-medical-inputs-20261025-v1
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze exact public national NSI without changing prior releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/sgrt_zero/publish.py
          --built "$RUNNER_TEMP/sgrt-zero-federal-medical-source"
          --freeze-federal --source-commit "$GITHUB_SHA"
