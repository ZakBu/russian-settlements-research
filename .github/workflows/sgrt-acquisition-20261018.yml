name: SGRT three-stage acquisition
on:
  push:
    branches: [research/sgrt-final-protocol-20261018]
    paths: [.github/workflows/sgrt-acquisition-20261018.yml]
permissions:
  contents: read
jobs:
  data-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/sgrt_20261018
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests
      - run: python research/sgrt_20261018/acquire_inputs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sgrt-three-stage-inputs
          path: sgrt_inputs/
          retention-days: 90
