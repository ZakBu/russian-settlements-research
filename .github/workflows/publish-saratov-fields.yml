name: Rebuild complete Saratov functional pilot
on:
  workflow_dispatch:
  push:
    branches:
      - research/saratov-fields-v2-rebuild-20261029
permissions:
  contents: write
concurrency:
  group: saratov-fields-20261029-v2
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      release_id: ${{ steps.rebuild.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned figure-export browser
        run: |
          export NODE_PATH="$RUNNER_TEMP/saratov-figure-runtime/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/saratov-figure-browsers"
          echo "NODE_PATH=$NODE_PATH" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/saratov-figure-runtime"
          cp scripts/sgrt_saratov/figures.package.json "$RUNNER_TEMP/saratov-figure-runtime/package.json"
          npm install --prefix "$RUNNER_TEMP/saratov-figure-runtime" --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/saratov-figure-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - run: python -m pip install -r requirements-saratov-fields.txt
      - name: Refuse an existing v2 release or tag before calculating
        run: |
          python - <<'PY'
          import os,subprocess
          from scripts.sgrt_saratov.cloud_regional_research import TAG,releases
          assert TAG=='sgrt-saratov-fields-20261029-v2'
          if any(r['tag_name']==TAG for r in releases()):raise SystemExit('Existing v2 release/draft cannot be overwritten')
          r=subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/ref/tags/{TAG}'],capture_output=True,text=True)
          if r.returncode==0 or 'HTTP 404' not in r.stderr:raise SystemExit('Cannot establish absence of v2 tag')
          PY
      - name: Directed transport, unknown-data and functional counterexamples
        run: python -m unittest discover -s tests -p 'test_sgrt_saratov*.py'
      - name: Rebuild immutable inputs, compare complete results and create draft only
        id: rebuild
        run: |
          set -euo pipefail
          python scripts/sgrt_saratov/cloud_regional_research.py --source-commit "$GITHUB_SHA" --workdir "$RUNNER_TEMP/saratov-fields"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'saratov-fields/draft.json').read_text())
          assert p['draft'] is True and p['release_tag']=='sgrt-saratov-fields-20261029-v2'
          assert p['source_commit']==os.environ['GITHUB_SHA']
          print('release_id='+str(p['release_id']))
          PY
      - name: Preserve complete comparison and independent numerical checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saratov-fields-controls
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/saratov-fields/actual_control.json
            ${{ runner.temp }}/saratov-fields/checks/*.json
            ${{ runner.temp }}/saratov-fields/draft.json
            ${{ runner.temp }}/saratov-fields/built/manifest.json
            ${{ runner.temp }}/saratov-fields/results/figures/render_proof.json
            ${{ runner.temp }}/saratov-fields/unpublished_mismatch_results.zip
  verify_publish_register:
    needs: rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RELEASE_ID: ${{ needs.rebuild.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent byte and publication counterexamples
        run: python -m unittest tests.test_sgrt_saratov_release_registration tests.test_sgrt_saratov_verified_publication
      - name: Verify all draft bytes and producer Git, publish, verify nineteen public downloads
        run: |
          set -euo pipefail
          python scripts/sgrt_saratov/publish_verified_regional.py --release-id "$SOURCE_RELEASE_ID" --producer "$GITHUB_SHA" --download-dir "$RUNNER_TEMP/saratov-v2-downloads" --registration-dir "$RUNNER_TEMP/saratov-v2-registration"
          python - <<'PY' > "$RUNNER_TEMP/saratov-v2-metadata-files.txt"
          from scripts.sgrt_saratov.publish_verified_regional import REGISTRATION_FILES
          print('\n'.join(REGISTRATION_FILES))
          PY
      - name: Push four verified metadata files on a new branch, never main
        run: |
          set -euo pipefail
          export TASK_METADATA_BRANCH=publication/saratov-v2-data-registration-20261029
          python - <<'PY'
          import os,subprocess
          branch='refs/heads/'+os.environ['TASK_METADATA_BRANCH']
          r=subprocess.run(['git','ls-remote','--exit-code','--heads','origin',branch],capture_output=True,text=True)
          if r.returncode!=2 or r.stdout.strip():raise SystemExit('Existing metadata branch or remote lookup failure; no overwrite')
          PY
          git fetch --no-tags --depth=1 origin main
          git switch --create "$TASK_METADATA_BRANCH" FETCH_HEAD
          python - <<'PY'
          import os,shutil,subprocess
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          files=(temp/'saratov-v2-metadata-files.txt').read_text().splitlines()
          assert len(files)==4 and len(set(files))==4
          for name in files:
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts and p.suffix=='.json'
              p.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(temp/'saratov-v2-registration'/p,p)
          subprocess.run(['git','add','--',*files],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(staged)==set(files),'Only the four verified metadata files may be committed'
          PY
          TASK_METADATA_TREE=$(git write-tree)
          python scripts/check_repository_policy.py --ref "$TASK_METADATA_TREE"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Register independently verified Saratov v2 data'
          git push origin "HEAD:refs/heads/$TASK_METADATA_BRANCH"
      - name: Preserve independent publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saratov-v2-independent-registration
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/saratov-v2-registration/**/*.json
