name: Finalize verified preserved Saratov computation
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: saratov-fields-20261029-v1
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Fetch the exact original computation tree
        run: git fetch --no-tags --depth=1 origin 51052edc968a3eb4ac31f88bf81f59ed9481ab9b
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned figure-export browser
        run: |
          export NODE_PATH="$RUNNER_TEMP/saratov-figure-runtime/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/saratov-figure-browsers"
          echo "NODE_PATH=$NODE_PATH" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/saratov-figure-runtime"
          cp scripts/sgrt_saratov/figures.package.json "$RUNNER_TEMP/saratov-figure-runtime/package.json"
          npm install --prefix "$RUNNER_TEMP/saratov-figure-runtime" --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/saratov-figure-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - run: python -m pip install -r requirements-saratov-fields.txt
      - name: Check scientific and preserved-output counterexamples
        run: python -m unittest discover -s tests -p 'test_sgrt_saratov*.py'
      - name: Download immutable preserved diagnostic bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/saratov-preserved"
          gh release download diagnostic-saratov-fields-40806711713 --repo "$GITHUB_REPOSITORY" --pattern actual_control.json --pattern expected_control.json --pattern independent_checks.zip --pattern unpublished_mismatch_results.zip --dir "$RUNNER_TEMP/saratov-preserved"
      - name: Verify unchanged computation, rehash all outputs and create draft only
        run: |
          set -euo pipefail
          python scripts/sgrt_saratov/finalize_regional_research.py --source-commit "$GITHUB_SHA" --preserved-dir "$RUNNER_TEMP/saratov-preserved" --workdir "$RUNNER_TEMP/saratov-finalize" 2>&1 | tee "$RUNNER_TEMP/saratov-finalize-console.log"
      - name: Preserve assembly evidence and readable failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saratov-finalize-controls
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/saratov-finalize-console.log
            ${{ runner.temp }}/saratov-finalize/actual_control.json
            ${{ runner.temp }}/saratov-finalize/checks/*.json
            ${{ runner.temp }}/saratov-finalize/draft.json
            ${{ runner.temp }}/saratov-finalize/built/manifest.json
            ${{ runner.temp }}/saratov-finalize/results/figures/render_proof.json
