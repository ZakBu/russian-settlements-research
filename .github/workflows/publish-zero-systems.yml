name: Reproduce and publish zero-level systems
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-zero-systems-20261025-v1
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install -r requirements-sgrt-zero.txt
      - name: Test scientific rules and publication integrity
        run: python -m unittest discover -s tests -p 'test_sgrt_zero_*.py'
      - name: Recompute from frozen national sources
        run: >-
          python scripts/sgrt_zero/reproduce.py
          --workdir "$RUNNER_TEMP/sgrt-zero"
          --source-commit "$GITHUB_SHA"
          --source-manifest-sha256 d9c8617dadbed91d92cf0cf1e139af67fddf5e9c33c7c50f09cd577c0c664ddc
      - name: Publish a new immutable result without changing latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sgrt_zero/publish.py --built "$RUNNER_TEMP/sgrt-zero/built"
