name: Publish Krasnodar access maps
on:
  push:
    branches: [research/krasnodar-maps-presentation]
    paths: ['.github/workflows/publish-krasnodar-access.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: krasnodar-access-maps-20261031-v1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: krasnodar-access-maps-20261031-v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set runner-local output directories
        run: |
          echo "WORK=$RUNNER_TEMP/krasnodar-access" >> "$GITHUB_ENV"
          echo "RAW=$RUNNER_TEMP/krasnodar-raw" >> "$GITHUB_ENV"
          echo "STUDIES=$RUNNER_TEMP/krasnodar-studies" >> "$GITHUB_ENV"
          echo "APP=$RUNNER_TEMP/krasnodar-app" >> "$GITHUB_ENV"
          echo "PUBLICATION=$RUNNER_TEMP/krasnodar-publication" >> "$GITHUB_ENV"
      - name: Refuse to replace a published scientific release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite scientific assets.'
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned calculation and rendering dependencies
        run: |
          python -m pip install -r scripts/krasnodar_access/requirements.txt
          python -m pip install matplotlib==3.10.3
      - name: Reproduce road access from pinned source data
        run: |
          set -euo pipefail
          python scripts/krasnodar_access/run.py --work "$WORK"
      - name: Retrieve pinned reference geography and five exact study relations
        run: |
          set -euo pipefail
          mkdir -p "$RAW"
          gh release download atlas-boundaries-20261026-v1 --repo "$GITHUB_REPOSITORY" --pattern RUS-adm2.geojson --dir "$RAW"
          echo '3c8dd7b7d6977c506c0cfb2c1b3a328df6abd585a709a468648a5e3566ff1bad  '"$RAW/RUS-adm2.geojson" | sha256sum --check --strict
          python scripts/krasnodar_publish.py nominatim --output "$RAW"
      - name: Build source-backed study comparisons and atlas payload
        run: |
          set -euo pipefail
          python scripts/krasnodar_studies/build_catalog.py --adm2 "$RAW/RUS-adm2.geojson" --census "$WORK/population/data/population/settlements_census_wide.parquet" --raw-dir "$RAW" --output "$STUDIES"
          python scripts/krasnodar_assets.py --access "$WORK/results" --studies "$STUDIES" --output "$APP" --source-commit "$GITHUB_SHA"
          python scripts/krasnodar_publish.py package --app "$APP" --results "$WORK/results" --input "$WORK/input" --raw "$RAW" --output "$PUBLICATION" --source-commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
      - name: Publish immutable release including the preserved road snapshot
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release appeared during reproduction; refusing to replace it.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$PUBLICATION/app.zip" "$PUBLICATION/results.zip" "$PUBLICATION/inputs.zip" "$PUBLICATION/south-fed-district-261029.osm.pbf" "$PUBLICATION/access-destinations.png" "$PUBLICATION/candidate-sensitivity.png" "$PUBLICATION/release_catalog.json" "$PUBLICATION/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --title 'Краснодар: доступность, исследования и транспортный сценарий' --notes-file "$PUBLICATION/release_notes.md"
      - name: Show the immutable site-loader catalog
        run: cat "$PUBLICATION/release_catalog.json"
