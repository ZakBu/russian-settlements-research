name: SGRT public enrichment 20261018
on:
  push:
    branches: [research/sgrt-final-protocol-20261018]
    paths: [.github/workflows/sgrt-public-enrichment-20261018.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/sgrt_protocol
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas pyarrow beautifulsoup4
      - run: python research/sgrt_protocol/acquire_public_inputs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sgrt-public-enrichment-20261018
          path: sgrt_enrichment/
          retention-days: 14
