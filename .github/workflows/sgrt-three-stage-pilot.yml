name: SGRT three-stage computational pilot
on:
  push:
    branches: [research/sgrt-final-protocol-20261018]
    paths: [.github/workflows/sgrt-three-stage-pilot.yml]
permissions:
  contents: read
  actions: read
jobs:
  three-stage-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/sgrt_20261018
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas scipy scikit-learn statsmodels matplotlib pyproj
      - uses: actions/download-artifact@v4
        with:
          name: sgrt-source-preflight-20261018
          run-id: 39162490106
          github-token: ${{ github.token }}
          path: in/base
      - uses: actions/download-artifact@v4
        with:
          name: sgrt-three-stage-inputs
          run-id: 39163132738
          github-token: ${{ github.token }}
          path: in/economic
      - uses: actions/download-artifact@v4
        with:
          name: sgrt-source-extracts-20261018
          run-id: 39163170414
          github-token: ${{ github.token }}
          path: in/extra
      - name: Compute all three stages and internal checks
        run: python -u research/sgrt_20261018/run_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sgrt-computational-pilot-20261018
          path: |
            pilot/
            research/sgrt_20261018/RESEARCH_PROTOCOL.md
            research/sgrt_20261018/run_pilot.py
            in/economic/download_manifest.json
            in/economic/rfsd_revision.json
            in/extra/source_manifest.json
          retention-days: 90
