name: Saratov native-road border details
on:
  push:
    branches: [research/saratov-service-evidence-20261103]
    paths: [.github/workflows/saratov-native-country-details.yml]
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 pyarrow==26.0.0 shapely==2.1.2 pyproj==3.7.2
      - run: python -m scripts.sgrt_saratov.domestic_native_edges --work "$RUNNER_TEMP/saratov-native-country" --check-fixture
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_context/analysis_snapshots/saratov_native_country_details_20261103.json
          git commit -m 'Save native-road border magnitudes and endpoint counterexample'
          git push origin HEAD:research/saratov-service-evidence-20261103
