name: Reproduce and publish national local systems
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-sgrt-mass.txt
      - name: Recompute from frozen national sources
        run: python scripts/sgrt_mass/reproduce.py --workdir "$RUNNER_TEMP/sgrt-mass" --source-commit "$GITHUB_SHA"
      - name: Check identities, eligibility and population conservation
        run: |
          python -m unittest discover -s tests -p 'test_sgrt_mass_*.py'
          python scripts/sgrt_mass/check.py --root "$RUNNER_TEMP/sgrt-mass"
      - name: Publish a new immutable research version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sgrt_mass/publish.py --built "$RUNNER_TEMP/sgrt-mass/built"
