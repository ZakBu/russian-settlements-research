name: Research atlas
on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/build_site_data.py', 'scripts/site_content.py', 'requirements-site.txt', 'data/**', 'research_context/current_state.json', 'research_context/diary/**', 'sgrt/**', 'POPULATION_BASE.md', 'tests/test_*site*.py', '.github/workflows/site*.yml']
  pull_request:
    paths: ['web/**', 'scripts/build_site_data.py', 'scripts/site_content.py', 'requirements-site.txt', 'data/**', 'research_context/current_state.json', 'research_context/diary/**', 'sgrt/**', 'POPULATION_BASE.md', 'tests/test_*site*.py', '.github/workflows/site*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-site.txt
      - run: python scripts/check_repository_policy.py
      - run: python scripts/site_content.py sync-state --json
      - run: python scripts/site_content.py validate --json
      - run: python -m unittest discover -s tests -p 'test_site_*.py'
      - run: python -m unittest discover -s tests -p 'test_build_site_data.py'
      - uses: actions/cache@v4
        with:
          path: .research-cache/site
          key: atlas-data-v2-${{ hashFiles('data/catalog.json', 'data/local_systems_catalog_20261024.json', 'data/site_assets.json', 'web/content/datasets.json', 'web/content/layers/*.json') }}
      - run: python scripts/build_site_data.py
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - name: Prepare browser for interaction checks
        run: |
          if command -v chromium >/dev/null 2>&1; then
            chromium --version
          elif command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            npx --prefix web playwright install --with-deps chromium
          fi
      - name: Prepare Word export
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          pandoc-version: '3.1.11.1'
      - run: python -m unittest discover -s tests -p 'test_word_export.py'
      - run: npm --prefix web run build
        env:
          PUBLIC_BASE_PATH: /russian-settlements-research/
      - name: Check real browser journeys
        run: npm --prefix web test
        env:
          PUBLIC_BASE_PATH: /russian-settlements-research/
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-browser-evidence
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - name: Keep downloadable PR preview
        uses: actions/upload-artifact@v4
        with:
          name: atlas-preview-${{ github.event.pull_request.number || github.sha }}
          path: web/dist
          retention-days: 7
          if-no-files-found: error
      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public static atlas
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Verify the published website in the browser
        run: npm --prefix web test
        env:
          SITE_TEST_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Save published browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-published-browser-evidence
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
