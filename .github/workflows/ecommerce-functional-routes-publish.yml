name: Publish functional centre dependencies
# Resolve PDF source links relative to each included document.
on:
  push:
    branches: [codex/ecommerce-settlement-cloud-20261025]
    paths:
      - '.github/workflows/ecommerce-functional-routes-publish.yml'
permissions:
  contents: read
jobs:
  reproduce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install research environment
        run: python -m pip install -r research/ecommerce_cloud/observed_operations_20261104/requirements.txt
      - name: Restore unchanged pinned census inputs
        run: python research/ecommerce_cloud/fetch_bundle.py
      - name: Rebuild synthesis and execute notebook
        run: python research/ecommerce_cloud/functional_routes_20261106/build_deliverables.py
      - name: Independently recount public registers
        run: python research/ecommerce_cloud/functional_routes_20261106/review/independent_checks.py --registers-only
      - name: Package minimal scientific extracts
        run: python research/ecommerce_cloud/functional_routes_20261106/package_results.py
      - name: Publish version without replacing earlier files
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_RELEASE_TAG: ecommerce-functional-routes-20261106-v1
        run: |
          if gh release view "$TASK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Versioned release exists; nothing will be replaced."
            exit 1
          fi
          gh release create "$TASK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Зависимость окружения от среднего центра: разные функции" --notes-file research/ecommerce_cloud/functional_routes_20261106/RELEASE_NOTES.md work/ecommerce_functional_20261106/release/*
      - name: Preserve generated artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: centre-functional-dependencies
          path: work/ecommerce_functional_20261106/release/
          if-no-files-found: warn
          retention-days: 30
