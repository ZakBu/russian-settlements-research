name: Publish accepted census population foundation
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sgrt-primary-population-v1
  cancel-in-progress: false
jobs:
  population:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-population.txt
      - name: Rebuild, validate and publish accepted census registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/maintenance/publish_population_base.py --workdir "$RUNNER_TEMP/population"
      - name: Commit verified primary catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f data/catalog.json data/population_dataset.json
          git add research_context/reviews/population_base_validation_20261022.json
          git commit -m "data: publish accepted three-census population foundation as default"
          git push origin HEAD:${{ github.ref_name }}
