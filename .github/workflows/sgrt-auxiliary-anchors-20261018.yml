name: SGRT auxiliary anchors
on:
  push:
    branches: [research/sgrt-final-protocol-20261018]
    paths: [.github/workflows/sgrt-auxiliary-anchors-20261018.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests
      - run: |
          mkdir -p aux
          python -u - <<'PY'
          import pathlib,requests,json,gzip,pyarrow.parquet as pq
          p=pathlib.Path('aux');base='https://github.com/ZakBu/russian-settlements-research/releases/download/working-settlements-stage71-2026-10-09/'
          for name in ['accepted_common_federal_territory_axis.csv','accepted_large_record_scope_classification_overlay.csv','accepted_source_scope_interpretation_overlay.csv','accepted_typed_joint_reporting_scope_spatial_associations.csv']:
              r=requests.get(base+name,timeout=60);r.raise_for_status();(p/name).write_bytes(r.content);print(name,r.text[:16000])
          url='https://huggingface.co/datasets/irlspbru/RFSD/resolve/main/RFSD/year=2021/part-0.parquet'
          r=requests.get(url,timeout=180);r.raise_for_status();pathlib.Path('rfsd.parquet').write_bytes(r.content)
          pf=pq.ParquetFile('rfsd.parquet');cols=['inn','eligible','filed','financial','simplified','imputed','geocoding_quality','outlier']
          with gzip.open(p/'rfsd2021_quality.csv.gz','wt') as f:
              first=True
              for b in pf.iter_batches(batch_size=100000,columns=cols):
                  b.to_pandas().to_csv(f,index=False,header=first);first=False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sgrt-auxiliary-anchors-20261018
          path: aux/
          retention-days: 14
