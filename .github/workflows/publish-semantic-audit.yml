name: Reproduce semantic error audit
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: semantic-audit-20261025-v1
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-sgrt-zero.txt
      - run: python -m unittest discover -s tests -p 'test_sgrt_zero_*.py'
      - name: Restore frozen published control
        run: python scripts/research_data.py fetch --catalog data/zero_catalog_20261025.json --dest "$RUNNER_TEMP/control" --cache "$RUNNER_TEMP/download-cache"
      - name: Recompute evidence and corrected descriptions
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/sgrt_zero/semantic_audit_bundle.py --bundle "$RUNNER_TEMP/control/sgrt/zero20261025" --workdir "$RUNNER_TEMP/semantic-audit" --source-commit "$GITHUB_SHA"
      - name: Publish separate immutable audit without changing latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create sgrt-semantic-audit-20261025-v1
          "$RUNNER_TEMP/semantic-audit/built/semantic-audit.zip"
          "$RUNNER_TEMP/semantic-audit/built/audit_manifest.json"
          --title "Ошибки сервисных профилей: данные аудита 25 октября 2026"
          --notes-file "$RUNNER_TEMP/semantic-audit/built/README.txt"
          --latest=false --target "$GITHUB_SHA"
