name: Audit historical Ozon availability in AllThePlaces
on:
  push:
    branches: [codex/ecommerce-settlement-cloud-20261025]
    paths:
      - '.github/workflows/ecommerce-ozon-source.yml'
      - 'research/ecommerce_cloud/continuation/audit_atp_ozon_history.py'
permissions:
  contents: read
jobs:
  ozon-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify six existing historical inventories
        run: python research/ecommerce_cloud/continuation/restore_atp_stats_pinned.py
      - name: Inspect actual annual run inventories and source history
        run: python research/ecommerce_cloud/continuation/audit_atp_ozon_history.py
      - name: Preserve exact source-audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-ozon-source-audit
          path: work/ecommerce_atp_ozon_audit/
          retention-days: 30
