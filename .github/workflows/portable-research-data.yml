name: Package portable research data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sgrt-portable-data-v1
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/sgrt-final-protocol-20261018
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow==26.0.0
      - name: Package, upload and verify every data object
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/maintenance/pack_research_release.py --workdir "$RUNNER_TEMP/sgrt-portable-data"
      - name: Save catalog, current state and diary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --ff-only origin research/sgrt-final-protocol-20261018
          cp "$RUNNER_TEMP/sgrt-portable-data/catalog.json" data/catalog.json
          python scripts/maintenance/record_data_completion.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/catalog.json research_context/current_state.json research_context/diary/2026-10-22.md
          git commit -m "data: verify complete portable archive and record handoff"
          git push origin HEAD:research/sgrt-final-protocol-20261018
