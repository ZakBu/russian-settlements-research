name: SGRT checked three-stage computational pilot
on:
  push:
    branches: [research/sgrt-final-protocol-20261018]
    paths: [.github/workflows/sgrt-three-stage-pilot-checked.yml]
permissions:
  contents: read
  actions: read
jobs:
  three-stage-pilot-checked:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/sgrt_20261018
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==3.0.6 numpy==2.5.4 scipy==1.18.1 scikit-learn==1.9.1 statsmodels==0.15.0 matplotlib==3.11.2 pyproj==3.8.0
      - run: pip freeze > pilot_environment.txt
      - uses: actions/download-artifact@v4
        with:
          name: sgrt-source-preflight-20261018
          run-id: 39162490106
          github-token: ${{ github.token }}
          path: in/base
      - uses: actions/download-artifact@v4
        with:
          name: sgrt-three-stage-inputs
          run-id: 39163132738
          github-token: ${{ github.token }}
          path: in/economic
      - uses: actions/download-artifact@v4
        with:
          name: sgrt-source-extracts-20261018
          run-id: 39163170414
          github-token: ${{ github.token }}
          path: in/extra
      - name: Compute three stages with explicit compatibility patch
        run: python -u research/sgrt_20261018/run_pilot_checked.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sgrt-checked-pilot-20261018
          path: |
            pilot/
            research/sgrt_20261018/
            pilot_environment.txt
            in/economic/download_manifest.json
            in/economic/rfsd_revision.json
            in/extra/source_manifest.json
          retention-days: 90
