name: Upload frozen Saratov sources to existing draft
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-saratov-fields.txt mapbox-vector-tile==2.2.0 protobuf==6.33.5 pyclipper==1.4.0
      - run: python scripts/sgrt_saratov/bootstrap_frozen_inputs.py --workdir "$RUNNER_TEMP/frozen-saratov-source-rebuild" --output "$RUNNER_TEMP/frozen-input-upload.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frozen-saratov-input-upload
          path: |
            ${{ runner.temp }}/frozen-input-upload.json
            ${{ runner.temp }}/frozen-saratov-source-rebuild/manifest.json
          retention-days: 14
          if-no-files-found: warn
