name: Finalize independently verified preserved Saratov v2 computation
on:
  push:
    branches:
      - research/saratov-fields-v2-finalize-20261029
permissions:
  actions: read
  contents: write
concurrency:
  group: saratov-fields-20261029-v2
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_id: ${{ steps.assemble.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Fetch the exact original computation tree
        run: git fetch --no-tags --depth=1 origin 3a8c35339d2719a8c433c669ea98bc99a3685f5e
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned figure-export browser
        run: |
          export NODE_PATH="$RUNNER_TEMP/saratov-figure-runtime/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/saratov-figure-browsers"
          echo "NODE_PATH=$NODE_PATH" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/saratov-figure-runtime"
          cp scripts/sgrt_saratov/figures.package.json "$RUNNER_TEMP/saratov-figure-runtime/package.json"
          npm install --prefix "$RUNNER_TEMP/saratov-figure-runtime" --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/saratov-figure-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - run: python -m pip install -r requirements-saratov-fields.txt
      - name: Check scientific and preserved-output counterexamples
        run: python -m unittest discover -s tests -p 'test_sgrt_saratov*.py'
      - name: Download immutable preserved diagnostic bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/saratov-preserved"
          gh release download diagnostic-saratov-fields-v2-40827228874 --repo "$GITHUB_REPOSITORY" --pattern actual_control.json --pattern expected_control.json --pattern independent_checks.zip --pattern unpublished_mismatch_results.zip --dir "$RUNNER_TEMP/saratov-preserved"
      - name: Download pinned public v1 reference without Authorization
        run: curl --fail --location --retry 2 'https://github.com/ZakBu/russian-settlements-research/releases/download/sgrt-saratov-fields-20261029-v1/saratov-fields.zip' --output "$RUNNER_TEMP/saratov-v1-reference.zip"
      - name: Verify unchanged computation, original unequal controls and existing numeric tolerance
        id: assemble
        run: |
          set -euo pipefail
          python scripts/sgrt_saratov/finalize_v2_regional_research.py --source-commit "$GITHUB_SHA" --numeric-reference-archive "$RUNNER_TEMP/saratov-v1-reference.zip" --preserved-dir "$RUNNER_TEMP/saratov-preserved" --workdir "$RUNNER_TEMP/saratov-finalize" 2>&1 | tee "$RUNNER_TEMP/saratov-finalize-console.log"
          python - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'saratov-finalize/draft.json').read_text())
          assert p['draft'] is True and p['release_tag']=='sgrt-saratov-fields-20261029-v2'
          assert p['source_commit']==os.environ['GITHUB_SHA']
          print('release_id='+str(p['release_id']))
          PYCODE
      - name: Preserve assembly evidence and readable failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saratov-v2-finalize-controls
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/saratov-finalize-console.log
            ${{ runner.temp }}/saratov-finalize/actual_control.json
            ${{ runner.temp }}/saratov-finalize/checks/*.json
            ${{ runner.temp }}/saratov-finalize/draft.json
            ${{ runner.temp }}/saratov-finalize/built/manifest.json
            ${{ runner.temp }}/saratov-finalize/results/figures/render_proof.json
  verify_publish_register:
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RELEASE_ID: ${{ needs.finalize.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned scientific comparison dependencies
        run: python -m pip install -r requirements-saratov-fields.txt
      - name: Download independent pinned v1 numeric reference
        run: curl --fail --location --retry 2 'https://github.com/ZakBu/russian-settlements-research/releases/download/sgrt-saratov-fields-20261029-v1/saratov-fields.zip' --output "$RUNNER_TEMP/saratov-v1-reference.zip"
      - name: Independent byte and publication counterexamples
        run: python -m unittest tests.test_sgrt_saratov_release_registration tests.test_sgrt_saratov_verified_publication tests.test_sgrt_saratov_preserved_numeric_comparison
      - name: Verify all draft bytes and producer Git, publish, verify nineteen public downloads
        run: |
          set -euo pipefail
          python scripts/sgrt_saratov/publish_verified_regional.py --numeric-reference-archive "$RUNNER_TEMP/saratov-v1-reference.zip" --release-id "$SOURCE_RELEASE_ID" --producer "$GITHUB_SHA" --download-dir "$RUNNER_TEMP/saratov-v2-downloads" --registration-dir "$RUNNER_TEMP/saratov-v2-registration"
          python - <<'PY' > "$RUNNER_TEMP/saratov-v2-metadata-files.txt"
          from scripts.sgrt_saratov.publish_verified_regional import REGISTRATION_FILES
          print('\n'.join(REGISTRATION_FILES))
          PY
      - name: Push four verified metadata files on a new branch, never main
        run: |
          set -euo pipefail
          export TASK_METADATA_BRANCH=publication/saratov-v2-data-registration-20261029
          python - <<'PY'
          import os,subprocess
          branch='refs/heads/'+os.environ['TASK_METADATA_BRANCH']
          r=subprocess.run(['git','ls-remote','--exit-code','--heads','origin',branch],capture_output=True,text=True)
          if r.returncode!=2 or r.stdout.strip():raise SystemExit('Existing metadata branch or remote lookup failure; no overwrite')
          PY
          git fetch --no-tags --depth=1 origin main
          git switch --create "$TASK_METADATA_BRANCH" FETCH_HEAD
          python - <<'PY'
          import os,shutil,subprocess
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          files=(temp/'saratov-v2-metadata-files.txt').read_text().splitlines()
          assert len(files)==4 and len(set(files))==4
          for name in files:
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts and p.suffix=='.json'
              p.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(temp/'saratov-v2-registration'/p,p)
          subprocess.run(['git','add','--',*files],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(staged)==set(files),'Only the four verified metadata files may be committed'
          PY
          TASK_METADATA_TREE=$(git write-tree)
          python scripts/check_repository_policy.py --ref "$TASK_METADATA_TREE"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Register independently verified Saratov v2 data'
          git push origin "HEAD:refs/heads/$TASK_METADATA_BRANCH"
      - name: Preserve independent publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saratov-v2-independent-registration
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/saratov-v2-registration/**/*.json
