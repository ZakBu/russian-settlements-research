name: Rebuild and prepare Saratov network isochrones
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saratov-isochrones-20261028-v1
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-saratov-isochrones.txt
      - name: Directed-edge, geometry, source and publication counterexamples
        run: python -m unittest discover -s tests -p 'test_sgrt_saratov*.py'
      - name: Rebuild pinned public inputs and create a checked draft only
        run: python scripts/sgrt_saratov/cloud_isochrones.py --source-commit "$GITHUB_SHA" --workdir "$RUNNER_TEMP/saratov-isochrones"
      - name: Preserve complete comparison and numerical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saratov-isochrones-controls
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/saratov-isochrones/actual_control.json
            ${{ runner.temp }}/saratov-isochrones/checks/*.json
            ${{ runner.temp }}/saratov-isochrones/draft.json
            ${{ runner.temp }}/saratov-isochrones/built/manifest.json
