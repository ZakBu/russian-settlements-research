name: Compact repository policy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/check_repository_policy.py

  boundary-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/boundaries-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Download ready-made Terrae 2026.10 Russia boundaries
        run: |
          mkdir -p source
          curl -fL --retry 3 --max-time 180 'https://huggingface.co/buckets/geodataset/terrae/resolve/releases/2026.10/manifest.json' -o source/manifest.json
          for level in adm1 adm2; do
            curl -fL --retry 3 --max-time 180 "https://huggingface.co/buckets/geodataset/terrae/resolve/$level/2026.10/places/medium/reference/polygons/RUS.gpkg" -o "source/RUS-$level.gpkg"
            curl -fL --retry 3 --max-time 180 "https://huggingface.co/buckets/geodataset/terrae/resolve/$level/2026.10/SHA256SUMS" -o "source/$level-SHA256SUMS"
          done
          sha256sum source/*.gpkg > source/download-sha256.txt
      - name: Convert standard GeoPackage with GDAL
        run: |
          if ! command -v ogr2ogr >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y gdal-bin
          fi
          for level in adm1 adm2; do
            ogr2ogr -f GeoJSON "source/RUS-$level.geojson" "source/RUS-$level.gpkg" "$level"
          done
          sha256sum source/*.geojson source/*.gpkg > source/download-sha256.txt
      - name: Preserve immutable reference boundaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create atlas-boundaries-20261026-v1 source/*.geojson source/*.gpkg source/manifest.json source/download-sha256.txt --title 'Справочная сетка 2026: Terrae / OpenStreetMap' --notes 'Terrae 2026.10, срез OSM 2026-09-28. Исходные GeoPackage и преобразование GDAL в GeoJSON. Справочные границы, не юридически значимые. © OpenStreetMap contributors; Terrae, ODbL-1.0. База населения не менялась.' --latest=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrae-russia-2026-source
          path: source
          retention-days: 7
