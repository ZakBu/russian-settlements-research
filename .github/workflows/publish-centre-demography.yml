name: Rebuild and publish fixed-centre demography
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: centre-demography-20261026-v1
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-centre-demography.txt
      - name: Four demographic regression tests
        run: |
          python - <<'PY'
          import runpy
          tests = runpy.run_path('tests/test_sgrt_zero_centre_demographic_readout.py')
          selected = [v for k,v in tests.items() if k.startswith('test_') and callable(v)]
          assert len(selected) == 4
          for test in selected: test()
          print('Four demographic tests passed')
          PY
          python -m unittest tests.test_sgrt_zero_cloud_demography
      - name: Release and map export guards
        run: python -m unittest discover -s tests -p test_sgrt_zero_cloud_demography.py
      - name: Rebuild, compare every row, and package
        run: python scripts/sgrt_zero/cloud_centre_demography.py --source-commit "$GITHUB_SHA" --workdir "$RUNNER_TEMP/centre-demography"
      - name: Publish new immutable release
        run: python scripts/sgrt_zero/cloud_centre_demography.py --source-commit "$GITHUB_SHA" --publish-built "$RUNNER_TEMP/centre-demography/built"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: centre-demography-checks
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/centre-demography/actual_control.json
            ${{ runner.temp }}/centre-demography/readout/summary.json
            ${{ runner.temp }}/centre-demography/readout/figures/figure_values.json
            ${{ runner.temp }}/centre-demography/built/manifest.json
