name: E-commerce nationwide continuation
on:
  push:
    branches: [codex/ecommerce-settlement-cloud-20261025]
    paths:
      - '.github/workflows/ecommerce-continuation.yml'
      - 'research/ecommerce_cloud/continuation/**'
      - 'research/ecommerce_cloud/extension/outcomes/nonshop_population_contexts.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecommerce-national-continuation
  cancel-in-progress: false
jobs:
  nonshop-population:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore and verify fixed inputs
        run: |
          python research/ecommerce_cloud/fetch_bundle.py
          python research/ecommerce_cloud/check_bundle.py
      - name: Install portable numerical requirements
        run: python -m pip install -r research/ecommerce_cloud/requirements.txt
      - name: Acquire pinned municipal population indicator
        run: python research/ecommerce_cloud/extension/outcomes/acquire_bdmo_population.py
      - name: Calculate nonshop-selected conditional population contexts
        run: python research/ecommerce_cloud/extension/outcomes/nonshop_population_contexts.py
      - name: Independently verify derived-source arithmetic
        run: python research/ecommerce_cloud/continuation/check_nonshop_population.py work/ecommerce_extension_outcomes/nonshop_population_contexts
      - name: Record environment
        run: python -m pip freeze > work/ecommerce_extension_outcomes/nonshop_population_contexts/environment.txt
      - name: Preserve complete new tables
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nonshop-population-contexts
          path: work/ecommerce_extension_outcomes/nonshop_population_contexts/
          retention-days: 30
          if-no-files-found: warn
  historical-wb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore and verify fixed settlement axis
        run: |
          python research/ecommerce_cloud/fetch_bundle.py
          python research/ecommerce_cloud/check_bundle.py
      - name: Install Parquet reader
        run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=16,<24'
      - name: Export immutable axis columns for stdlib audit
        run: |
          python - <<'PY'
          import pandas as pd
          p='work/sources/research/ecommerce_settlement_20261024/national/national_target_source2021.parquet'
          d=pd.read_parquet(p)
          cols=['source_record_id_2021','name_2021','region_2021','accepted_latitude_2021','accepted_longitude_2021']
          assert len(d)==144151 and d.source_record_id_2021.is_unique
          d[cols].to_csv('work/axis_min.csv',index=False)
          PY
      - name: Acquire and profile actual historical WB output
        run: python research/ecommerce_cloud/continuation/acquire_atp_historical.py --output work/ecommerce_atp_history --axis-csv work/axis_min.csv
      - name: Preserve acquisition evidence and complete object bodies
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-wb-acquisition
          path: work/ecommerce_atp_history/
          retention-days: 30
          if-no-files-found: warn
  public-survey-geography:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect public survey file inventories and variable headers
        run: python research/ecommerce_cloud/continuation/surveys_probe.py --output work/ecommerce_surveys_probe
      - name: Preserve bounded metadata and documentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-surveys-geography-probe
          path: work/ecommerce_surveys_probe/
          retention-days: 30
          if-no-files-found: warn
  rosstat-certificate-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Diagnose issuer chain without accepting source data
        run: python research/ecommerce_cloud/continuation/tls_chain_diagnostic.py
      - name: Preserve chain diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rosstat-certificate-chain-diagnosis
          path: work/ecommerce_tls_chain/
          retention-days: 30
