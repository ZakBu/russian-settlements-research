name: Publish purchase geography and centre functions
on:
  push:
    branches: [codex/ecommerce-settlement-cloud-20261025]
    paths:
      - '.github/workflows/ecommerce-flows-publish.yml'
permissions:
  contents: read
jobs:
  reproduce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install portable research environment
        run: python -m pip install -r research/ecommerce_cloud/extension/requirements-report.txt
      - name: Restore twelve pinned public source members
        run: python research/ecommerce_cloud/flows_20261026/fetch_kouzh_inputs.py
      - name: Execute weighted analyses, independent check and notebook
        run: python research/ecommerce_cloud/flows_20261026/build_deliverables.py
      - name: Package aggregate evidence without person records
        run: python research/ecommerce_cloud/flows_20261026/package_results.py
      - name: Publish new release without replacing older files
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_RELEASE_TAG: ecommerce-purchase-geography-20261026-v1
        run: |
          if gh release view "$TASK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Versioned release exists; nothing will be replaced."
            exit 1
          fi
          gh release create "$TASK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Покупки, обучение и зависимость от внешнего центра" --notes-file research/ecommerce_cloud/flows_20261026/RELEASE_NOTES.md work/ecommerce_flows_20261026/release/*
      - name: Preserve produced aggregate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: purchase-geography-research
          path: work/ecommerce_flows_20261026/release/
          if-no-files-found: warn
          retention-days: 30
