name: Publish Krasnodar boundary comparison
on:
  push:
    branches: [research/krasnodar-clear-method]
    paths: ['.github/workflows/publish-krasnodar-context.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: krasnodar-delimitation-context-20261031-v1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: krasnodar-delimitation-context-20261031-v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install matplotlib==3.10.3 shapely==2.1.2
      - name: Reproduce membership comparison from pinned geography
        run: |
          set -euo pipefail
          gh release download atlas-boundaries-20261026-v1 --repo "$GITHUB_REPOSITORY" --pattern RUS-adm2.geojson --dir "$RUNNER_TEMP/reference"
          python scripts/krasnodar_boundary_comparison.py --boundaries "$RUNNER_TEMP/reference/RUS-adm2.geojson" --output "$RUNNER_TEMP/krasnodar-context"
      - name: Retrieve the six inspected public census text extractions
        run: |
          set -euo pipefail
          python scripts/krasnodar_census_sources.py --output "$RUNNER_TEMP/krasnodar-context"
          cp research_context/krasnodar_agglomeration/comparison/census_sources.json "$RUNNER_TEMP/krasnodar-context/"
      - name: Record source version and every published checksum
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'krasnodar-context'
          (p/'README.txt').write_text('Сравнение перечней ИЭГ: 9 муниципалитетов исследования 2018 года и 7 состава 2023 года. Справочная геометрия Terrae 2026.10 / © OpenStreetMap contributors, 28.09.2026, ODbL-1.0 (https://opendatacommons.org/licenses/odbl/1-0/). Исторические границы не восстановлены, поездки не измерены. census_0.txt–census_5.txt — машинные текстовые извлечения официальных XLSX, не оригинальные бинарные книги. Перепись на 01.10.2021; объединённые ячейки оригиналов не проверены. URL и SHA — census_sources.json.\n')
          metadata={'sourceCommit':os.environ['GITHUB_SHA'],'not_observed_commuting_boundary':True,'reference_geography_date':'2026-09-28','files':{x.name:{'bytes':x.stat().st_size,'sha256':hashlib.sha256(x.read_bytes()).hexdigest()} for x in sorted(p.iterdir()) if x.is_file()}}
          (p/'context_manifest.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+'\n')
          (p.parent/'krasnodar-notes.md').write_text('Сравнение опубликованных составов ИЭГ (2018: 9 муниципалитетов; 2023: 7) на справочных контурах 2026 года. Это не новая граница по наблюдаемым поездкам. Геометрия: Terrae / © OpenStreetMap contributors, ODbL-1.0.\n\nШесть машинных извлечений официальных переписных таблиц, а не бинарные Excel. Дата наблюдения: 1 октября 2021 года. Исходные ссылки и SHA сохранены.\n\nИсточник кода и реестров: '+os.environ['GITHUB_SHA']+'.\n')
          PY
      - name: Publish a new immutable release without changing earlier results
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace scientific assets.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/krasnodar-context/"* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --title 'Краснодар: существующие составы и доступность данных' --notes-file "$RUNNER_TEMP/krasnodar-notes.md"
