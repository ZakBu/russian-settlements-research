name: Publish joint dependencies and historical Ozon geography
on:
  push:
    branches: [codex/ecommerce-settlement-cloud-20261025]
    paths:
      - '.github/workflows/ecommerce-joint-publish.yml'
permissions:
  contents: read
jobs:
  reproduce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install portable research environment
        run: |
          python -m pip install -r research/ecommerce_cloud/extension/requirements-report.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext
      - name: Restore source census geography and public survey inputs
        run: |
          python research/ecommerce_cloud/fetch_bundle.py
          python research/ecommerce_cloud/flows_20261026/fetch_kouzh_inputs.py
      - name: Restore and independently verify historical tariff geography
        run: |
          python research/ecommerce_cloud/next_direction_20261103/fetch_ozon_policy_20261103.py
          python research/ecommerce_cloud/next_direction_20261103/parse_ozon_eligibility_20261103.py --axis work/sources/research/ecommerce_settlement_20261024/national/national_target_source2021.parquet
          python research/ecommerce_cloud/next_direction_20261103/independent_programme_check.py
          python research/ecommerce_cloud/next_direction_20261103/pilot_programme_geography.py
      - name: Execute joint analyses, independent check and notebook
        run: python research/ecommerce_cloud/next_direction_20261103/build_deliverables.py
      - name: Package aggregate evidence
        run: python research/ecommerce_cloud/next_direction_20261103/package_results.py
      - name: Publish a new version without replacing older files
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_RELEASE_TAG: ecommerce-joint-dependencies-20261103-v1
        run: |
          if gh release view "$TASK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Versioned release exists; nothing will be replaced."
            exit 1
          fi
          gh release create "$TASK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Совместные зависимости и историческая география Ozon" --notes-file research/ecommerce_cloud/next_direction_20261103/RELEASE_NOTES.md work/ecommerce_joint_20261103/release/*
      - name: Preserve produced artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joint-dependencies-research
          path: work/ecommerce_joint_20261103/release/
          if-no-files-found: warn
          retention-days: 30
