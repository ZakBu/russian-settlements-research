name: Preserve public inputs for level zero
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-sgrt-zero.txt
      - name: Freeze public source responses without changing population release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sgrt_zero/capture_sources.py --output "$RUNNER_TEMP/zero-inputs" --snapshot 2026-10-25 --publish
