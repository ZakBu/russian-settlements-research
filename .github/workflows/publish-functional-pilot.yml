name: Publish computed functional pilot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install -r requirements-sgrt-pilot.txt
      - name: Reproduce source-backed pilot
        run: python scripts/sgrt_pilot/reproduce_release.py --workdir "$RUNNER_TEMP/sgrt-pilot" --tag sgrt-pilot-20261024-v1 --source-commit "$GITHUB_SHA"
      - name: Publish verified outputs in the pilot draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sgrt_pilot/publish_release.py --built "$RUNNER_TEMP/sgrt-pilot/built" --tag sgrt-pilot-20261024-v1
