name: Rebuild and publish common local systems
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: common-systems-20261027-v1
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-common-systems.txt
      - name: Scientific and publication counterexamples
        run: |
          python -m unittest discover -s tests -p 'test_sgrt_zero_common*.py'
          python -m unittest discover -s tests -p 'test_sgrt_zero_functional_orders.py'
          python -m unittest discover -s tests -p 'test_sgrt_zero_common_economic*.py'
          python -m unittest discover -s tests -p 'test_sgrt_zero_cloud_common*.py'
      - name: Rebuild from pinned public input bytes and compare all rows
        run: python scripts/sgrt_zero/cloud_common_systems.py --source-commit "$GITHUB_SHA" --workdir "$RUNNER_TEMP/common-systems"
      - name: Publish a new immutable scientific release
        run: python scripts/sgrt_zero/cloud_common_systems.py --source-commit "$GITHUB_SHA" --publish-built "$RUNNER_TEMP/common-systems/built"
      - name: Preserve scientific controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: common-systems-checks
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/common-systems/source_facts.json
            ${{ runner.temp }}/common-systems/actual_control.json
            ${{ runner.temp }}/common-systems/results/**/summary.json
            ${{ runner.temp }}/common-systems/built/manifest.json
