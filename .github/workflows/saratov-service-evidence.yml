name: Saratov service evidence
on:
  push:
    branches: [research/saratov-service-evidence-20261103]
    paths: [.github/workflows/saratov-service-evidence.yml]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 pyarrow==26.0.0 shapely==2.1.2 pyproj==3.7.2
      - name: Check relevant identity and geography rules
        run: python -m unittest tests.test_sgrt_saratov_centre_evidence_audit tests.test_sgrt_saratov_country_scope -v
      - name: Calculate evidence from archived inputs and publish small result
        run: python -m scripts.sgrt_saratov.service_evidence --work "$RUNNER_TEMP/saratov-service-evidence" --publish
      - name: Save actual scientific summaries
        run: |
          python scripts/check_repository_policy.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_context/analysis_snapshots/saratov_service_*20261103.json
          git commit -m 'Save calculated Saratov source sensitivity, school comparison and native-road screen'
          git push origin HEAD:research/saratov-service-evidence-20261103
