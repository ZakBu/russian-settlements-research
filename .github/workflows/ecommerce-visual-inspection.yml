name: Render pinned published research for visual inspection
on:
  push:
    branches: [codex/ecommerce-settlement-cloud-20261025]
    paths:
      - '.github/workflows/ecommerce-visual-inspection.yml'
permissions:
  contents: read
jobs:
  published-visual-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: pages
            group: 0
          - mode: pages
            group: 1
          - mode: pages
            group: 2
          - mode: pages
            group: 3
          - mode: pages
            group: 4
          - mode: pages
            group: 5
          - mode: pages
            group: 6
          - mode: pages
            group: 7
          - mode: charts
            group: 0
          - mode: charts
            group: 1
          - mode: charts
            group: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install PDF preview dependencies
        run: python -m pip install 'PyMuPDF>=1.24,<2' 'Pillow>=10,<14'
      - name: Verify published bytes and render inspection images
        run: python research/ecommerce_cloud/continuation/inspect_published_visuals.py --mode ${{ matrix.mode }} --group ${{ matrix.group }}
