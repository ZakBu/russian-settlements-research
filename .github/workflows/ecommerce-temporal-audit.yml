name: Audit e-commerce register dates and primary rosters
on:
  workflow_dispatch:
  push:
    branches: [codex/ecommerce-settlement-cloud-20261025]
    paths:
      - '.github/workflows/ecommerce-temporal-audit.yml'
      - 'research/ecommerce_cloud/continuation/register_temporal_audit.py'
permissions:
  contents: read
concurrency:
  group: ecommerce-temporal-audit-working-branch
  cancel-in-progress: false
jobs:
  temporal-register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore pinned source bundle
        run: python research/ecommerce_cloud/fetch_bundle.py
      - name: Verify all pinned files before read-only audit
        run: python research/ecommerce_cloud/check_bundle.py
      - name: Install portable numerical environment
        run: python -m pip install -r research/ecommerce_cloud/requirements.txt
      - name: Run the three preserved computational checks
        run: python research/ecommerce_cloud/run_checks.py
      - name: Record actual packages
        run: python -m pip freeze > work/ecommerce_temporal_environment.txt
      - name: Inspect future-dated rows and probe missing primary rosters
        run: python research/ecommerce_cloud/continuation/register_temporal_audit.py --output work/ecommerce_temporal_audit
      - name: Preserve bounded audit outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecommerce-temporal-register-audit
          path: work/ecommerce_temporal_audit/
          retention-days: 14
          if-no-files-found: warn
