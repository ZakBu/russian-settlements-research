name: Reproduce and publish local systems
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-sgrt-pilot.txt
      - name: Reproduce from pinned sources and the accepted population base
        run: python scripts/sgrt_local/reproduce.py --workdir "$RUNNER_TEMP/sgrt-local" --source-commit "$GITHUB_SHA"
      - name: Check scientific identities
        run: |
          python -m unittest discover -s tests -p 'test_sgrt_local_*.py'
          python scripts/sgrt_local/check.py --root "$RUNNER_TEMP/sgrt-local"
      - name: Publish new version without replacing the primary population release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sgrt_local/publish.py --built "$RUNNER_TEMP/sgrt-local/built"
