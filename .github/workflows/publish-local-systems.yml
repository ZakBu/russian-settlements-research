name: Preserve primary Rosstat settlement workbooks
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve verified primary source without replacing population release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sgrt_mass/acquire_rosstat.py --output "$RUNNER_TEMP/rosstat-source" --publish
