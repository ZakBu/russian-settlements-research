name: Rebuild and prepare exploratory economic and cooperation draft
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: upper-research-20261027-v1
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-upper-research.txt
      - name: Scientific and publication counterexamples
        run: |
          python -m unittest discover -s tests -p 'test_sgrt_zero_centrality_profiles.py'
          python -m unittest discover -s tests -p 'test_sgrt_zero_municipal*.py'
          python -m unittest discover -s tests -p 'test_sgrt_zero_hierarchy_gravity.py'
          python -m unittest discover -s tests -p 'test_sgrt_zero_urban_cooperation.py'
          python -m unittest discover -s tests -p 'test_sgrt_zero_cloud_upper.py'
          python -m unittest discover -s tests -p 'test_sgrt_zero_census_workplace*.py'
          python -m unittest discover -s tests -p 'test_sgrt_zero_census_cooperation.py'
          python -m unittest discover -s tests -p 'test_sgrt_zero_national_external_envelope_audit.py'
          python -m unittest discover -s tests -p 'test_sgrt_zero_audit_upper_research.py'
      - name: Rebuild immutable public inputs and compare every output row
        run: python scripts/sgrt_zero/cloud_upper_research.py --source-commit "$GITHUB_SHA" --workdir "$RUNNER_TEMP/upper-research"
      - name: Create verified draft; root reviews before public release
        run: python scripts/sgrt_zero/cloud_upper_research.py --source-commit "$GITHUB_SHA" --publish-built "$RUNNER_TEMP/upper-research/built"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upper-research-controls
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/upper-research/source_facts.json
            ${{ runner.temp }}/upper-research/actual_control.json
            ${{ runner.temp }}/upper-research/independent_audit/*.json
            ${{ runner.temp }}/upper-research/results/**/summary.json
            ${{ runner.temp }}/upper-research/results/**/*summary.json
            ${{ runner.temp }}/upper-research/built/manifest.json
