name: SGRT source extraction 20261018
on:
  push:
    branches: [research/sgrt-final-protocol-20261018]
    paths: [.github/workflows/sgrt-source-extract-20261018.yml]
permissions:
  contents: read
jobs:
  source-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests scipy
      - name: Download and inspect actual source data
        run: |
          mkdir -p extracts work
          python -u - <<'PY'
          import requests,pathlib,json,hashlib,zipfile,re,gzip,shutil,concurrent.futures,time
          import pandas as pd
          import pyarrow.parquet as pq
          out=pathlib.Path('extracts'); work=pathlib.Path('work')
          base='https://raw.githubusercontent.com/ZakBu/russian-settlements-research/main/'
          release='https://github.com/ZakBu/russian-settlements-research/releases/download/working-settlements-stage71-2026-10-09/'
          urls={
           'primary_full.parquet':release+'primary_credited_source_year_full.parquet',
           'points.parquet':release+'applied_point_snapshot.parquet',
           'release_README.md':release+'README.md',
           'historical1989.parquet':base+'research_rebuild/evidence/historical_sources_integration_20261014/population_1989_selected_long.parquet',
           'municipal_bridge.csv.gz':base+'research_rebuild/evidence/tochno_enrichment_application_20261013/native_np_municipality_bridge.csv.gz',
           'municipal_attributes.csv':base+'research_rebuild/evidence/tochno_np_attach_20261013/attribute_availability.csv',
           'agriculture.zip':'https://storage.yandexcloud.net/tochno-st-catalog/Rosstat/data_bdmo_118_v20250918/by_section/data_section7_112_v20250918_section_file.zip',
           'territory.zip':'https://storage.yandexcloud.net/tochno-st-catalog/Rosstat/data_bdmo_118_v20250918/by_section/data_section6_112_v20250918_section_file.zip',
           'rfsd2021.parquet':'https://huggingface.co/datasets/irlspbru/RFSD/resolve/main/RFSD/year=2021/part-0.parquet',
           'rfsd2011.parquet':'https://huggingface.co/datasets/irlspbru/RFSD/resolve/main/RFSD/year=2011/part-0.parquet',
           'world_countries.geojson':'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson'
          }
          def acquire(item):
              name,url=item; p=work/name; h=hashlib.sha256(); n=0
              try:
                  r=requests.get(url,stream=True,timeout=(30,180));r.raise_for_status()
                  with p.open('wb') as f:
                      for b in r.iter_content(1024*1024):f.write(b);h.update(b);n+=len(b)
                  print('ACQUIRED',name,n,flush=True)
                  return {'file':name,'url':url,'resolved_url':r.url,'bytes':n,'sha256':h.hexdigest(),'status':'ok'}
              except Exception as e: print('SOURCE_ERROR',name,str(e),flush=True);return {'file':name,'url':url,'status':'error','error':str(e)}
          manifest=list(concurrent.futures.ThreadPoolExecutor(max_workers=4).map(acquire,urls.items()))
          schemas={}
          for m in manifest:
              if m['status']!='ok':continue
              name=m['file'];p=work/name
              try:
                  if name.startswith('rfsd'):
                      pf=pq.ParquetFile(p); cols=pf.schema_arrow.names
                      chosen=[c for c in cols if re.search(r'(^inn$|^year$|lat|lon|coord|geo|okved|outlier|filing|^line_(2110|1600|1150|2400)$|^okato$|^oktmo$)',c,re.I)]
                      schemas[name]={'rows':pf.metadata.num_rows,'columns':cols,'selected':chosen,'schema':str(pf.schema_arrow)}
                      target=out/(name.replace('.parquet','.csv.gz'))
                      with gzip.open(target,'wt',encoding='utf-8',newline='') as f:
                          first=True
                          for batch in pf.iter_batches(batch_size=100000,columns=chosen):
                              d=batch.to_pandas();d.to_csv(f,index=False,header=first);first=False
                      schemas[name]['head']=json.loads(pf.read_row_group(0,columns=chosen).slice(0,3).to_pandas().to_json(orient='records'))
                  elif name.endswith('.parquet'):
                      d=pd.read_parquet(p);schemas[name]={'shape':list(d.shape),'columns':list(d.columns),'head':json.loads(d.head(3).to_json(orient='records',force_ascii=False))}
                      d.to_csv(out/name.replace('.parquet','.csv.gz'),index=False,compression='gzip')
                  elif name.endswith('.zip'):
                      z=zipfile.ZipFile(p); schemas[name]={'members':[{'name':i.filename,'bytes':i.file_size} for i in z.infolist()]}
                      candidates=[i for i in z.infolist() if i.filename.endswith('.parquet')]
                      if candidates:
                          for i in candidates:
                              dest=work/(name.replace('.zip','_')+pathlib.Path(i.filename).name);dest.write_bytes(z.read(i))
                              d=pd.read_parquet(dest);schemas[i.filename]={'shape':list(d.shape),'columns':list(d.columns),'head':json.loads(d.head(5).to_json(orient='records',force_ascii=False))}
                              d.to_csv(out/name.replace('.zip','.csv.gz'),index=False,compression='gzip')
                      else:
                          candidates=[i for i in z.infolist() if i.filename.endswith('.csv')]
                          if candidates:
                              i=max(candidates,key=lambda a:a.file_size)
                              with z.open(i) as src,gzip.open(out/name.replace('.zip','.csv.gz'),'wb') as dst:shutil.copyfileobj(src,dst)
                              sample=pd.read_csv(out/name.replace('.zip','.csv.gz'),sep=None,engine='python',nrows=5)
                              schemas[name]['csv_head']=json.loads(sample.to_json(orient='records',force_ascii=False));schemas[name]['columns']=list(sample.columns)
                          else:shutil.copy(p,out/name)
                  else:shutil.copy(p,out/name)
              except Exception as e:schemas[name]={'processing_error':str(e)};print('PROCESSING_ERROR',name,str(e),flush=True)
          (out/'source_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          (out/'source_schemas.json').write_text(json.dumps(schemas,ensure_ascii=False,indent=2))
          print('SCHEMAS_BEGIN');print(json.dumps(schemas,ensure_ascii=False));print('SCHEMAS_END')
          print('FILES',[(p.name,p.stat().st_size) for p in out.iterdir()])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sgrt-source-extracts-20261018
          path: extracts/
          retention-days: 14
