name: Fetch Russia settlement tables
on:
  push:
    branches: ['cursor/sgrt-russia-sources-252c']
    paths: ['scripts/sgrt_sources/build_russia_settlement_tables.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Build tables and commit them
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python scripts/sgrt_sources/build_russia_settlement_tables.py
          git add -f sgrt/sources/russia
          git commit -m "Добавить поселенческие таблицы Росстата по регионам России" || exit 0
          git push origin HEAD:$BRANCH
