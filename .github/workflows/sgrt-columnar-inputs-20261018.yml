name: SGRT columnar inputs 20261018
on:
  push:
    branches: [research/sgrt-final-protocol-20261018]
    paths: [.github/workflows/sgrt-columnar-inputs-20261018.yml]
permissions:
  contents: read
jobs:
  prepare-columnar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip download pyarrow==19.0.1 --only-binary=:all: --no-deps --dest columnar/reader --platform manylinux_2_28_x86_64 --python-version 313 --implementation cp --abi cp313
      - name: Extract original public Parquet members
        run: |
          python - <<'PY'
          import urllib.request,zipfile,pathlib,hashlib,json
          p=pathlib.Path('columnar');manifest=[]
          for section,name in [(7,'agriculture'),(6,'territory')]:
              url=f'https://storage.yandexcloud.net/tochno-st-catalog/Rosstat/data_bdmo_118_v20250918/by_section/data_section{section}_112_v20250918_section_file.zip'
              zpath=pathlib.Path(name+'.zip');urllib.request.urlretrieve(url,zpath)
              zh=hashlib.sha256(zpath.read_bytes()).hexdigest()
              with zipfile.ZipFile(zpath) as z:
                  members=[x for x in z.namelist() if x.endswith('.parquet')]
                  assert len(members)==1
                  raw=z.read(members[0]);(p/(name+'.parquet')).write_bytes(raw)
                  manifest.append({'url':url,'zip_sha256':zh,'member':members[0],'member_sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)})
          (p/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sgrt-columnar-inputs-20261018
          path: columnar/
          retention-days: 14
