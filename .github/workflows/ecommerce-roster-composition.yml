name: Analyse recovered official roster composition
on:
  push:
    branches: [codex/ecommerce-settlement-cloud-20261025]
    paths:
      - '.github/workflows/ecommerce-roster-composition.yml'
      - 'research/ecommerce_cloud/extension/outcomes/full_roster_analysis.py'
      - 'research/ecommerce_cloud/extension/outcomes/trade_roster_sensitivity.py'
permissions:
  contents: read
jobs:
  roster-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore and verify old pinned research inputs
        run: |
          python research/ecommerce_cloud/fetch_bundle.py
          python research/ecommerce_cloud/check_bundle.py
      - name: Install portable analysis environment
        run: python -m pip install -r research/ecommerce_cloud/requirements.txt
      - name: Reproduce current conditional population panel
        run: |
          python research/ecommerce_cloud/extension/outcomes/acquire_bdmo_population.py
          python research/ecommerce_cloud/extension/outcomes/nonshop_population_contexts.py
      - name: Restore all three recovered official publications by ZIP and file SHA
        run: python research/ecommerce_cloud/continuation/restore_rosters_pinned.py
      - name: Inspect primary source schema
        run: python research/ecommerce_cloud/continuation/inspect_roster_schema.py
      - name: Compare full publication rosters and outcome sensitivity
        run: python research/ecommerce_cloud/extension/outcomes/full_roster_analysis.py
      - name: Check shop-stock and share sensitivity to confirmed roster continuity
        run: python research/ecommerce_cloud/extension/outcomes/trade_roster_sensitivity.py
      - name: Preserve complete composition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-roster-composition-analysis
          path: |
            work/ecommerce_extension_outcomes/nonshop_population_contexts/roster_analysis/
            work/ecommerce_rosters_verified/schema_probe.json
            work/ecommerce_rosters_verified/structure-20260210T1102.csv
          retention-days: 30
          if-no-files-found: warn
