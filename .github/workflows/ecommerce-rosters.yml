name: Verified Rosstat roster acquisition
on:
  push:
    branches: [codex/ecommerce-settlement-cloud-20261025]
    paths:
      - '.github/workflows/ecommerce-rosters.yml'
      - 'research/ecommerce_cloud/continuation/acquire_verified_rosters.py'
permissions:
  contents: read
jobs:
  verified-rosters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify official intermediate and fetch historical catalogue links
        run: python research/ecommerce_cloud/continuation/acquire_verified_rosters.py
      - name: Preserve downloaded public rosters and chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-rosstat-rosters
          path: work/ecommerce_rosters_verified/
          retention-days: 30
